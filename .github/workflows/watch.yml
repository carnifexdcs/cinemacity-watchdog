name: Cinema City watchdog

# Checks the Cinema City schedule and, when new Dune: Part Three showtimes
# appear in IMAX, opens an issue (GitHub then sends an email and a push to the app).
#
# Scheduled 4 times an hour even though the goal is detection within ~30 minutes:
# GitHub drops scheduled runs under load (measured 1 in 8). Extra runs cost
# nothing (public repo) and break nothing — reporting is driven by the state in
# state/seen.json, not by the clock, so an extra run just finds nothing changed
# and stays quiet. Minutes are deliberately off :00 and :30 and spread out to
# avoid the busiest moments.
on:
  schedule:
    - cron: "8,38 * * * *"
    - cron: "21,51 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Report all current showtimes, including ones already known"
        type: boolean
        default: false

# The state is committed back to the repo — concurrent runs would overwrite each other's commit.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the schedule
        id: watch
        # FILM_PATTERN must match the Czech title the API returns ("Duna: část třetí"),
        # so "třetí" ("third") keeps the 2021 Dune re-run out. FILM_DISPLAY is the
        # name used in issue titles. Change the patterns? Also clear state/seen.json
        # (otherwise the new selection is compared with the old state).
        env:
          FILM_PATTERN: třetí
          FILM_DISPLAY: "Dune: Part Three"
          AUDITORIUM_PATTERN: imax
        run: |
          python3 watch.py \
            --state state/seen.json \
            --report report.md \
            --title title.txt \
            ${{ inputs.force_report && '--force-report' || '' }}
      - name: Open an issue with the new showtimes
        if: steps.watch.outputs.has_news == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assigning to the owner is key: by default GitHub only emails
          # "Participating" notifications (assignments, mentions). Merely
          # "Watching" a repo gives only web/mobile notifications, no email.
          url=$(gh issue create \
            --title "$(cat title.txt)" \
            --body-file report.md \
            --assignee "${{ github.repository_owner }}")
          echo "Created: $url"
          # The issue is only a delivery channel for the notification — the email
          # goes out when it's created, so it's closed right away and the list of
          # open issues stays empty. The content stays readable under closed issues.
          gh issue close "$url" --reason completed
      - name: Save the state back to the repo
        run: |
          rm -f report.md title.txt
          if git diff --quiet -- state/seen.json; then
            echo "State unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Update schedule state ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # Another commit may have landed meanwhile — rebase and push again.
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "::error::Pushing the state failed."
          exit 1
